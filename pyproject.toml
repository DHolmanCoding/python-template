[project]
name = "python-template"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name"}
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "pre-commit>=4.3.0",
    "pyrefly>=1.0.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.1",
]

[tool.ruff]
line-length = 120
fix = true
src = ["python_template", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C4", "RUF", "I"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["python_template"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=python_template --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that touch external systems",
]

[tool.pyrefly]
preset = "strict"
python-version = "3.14"
project-includes = ["python_template", "tests"]
search-path = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
